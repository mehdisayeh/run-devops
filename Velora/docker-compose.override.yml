
services:
  velora.api:
    container_name: velora-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "MongoDB__ConnectionString=mongodb://velora-db:27017/?replicaSet=rs0&directConnection=true"
    depends_on:
      velora.db:
        condition: service_healthy
    ports:
      - "8000:8080"

  velora.client:
    container_name: velora-client
    environment:
      - ASPNETCORE_ENVIRONMENT=Development 
      - "CatalogApiUrl=http://velora-api:8080"
      - "DataProtection__KeysPath=/var/velora/keys"
    volumes:
      - velora-client-keys:/var/velora/keys
    depends_on:
      - velora.db
      - velora.api
    ports:
      - "8001:8080"

  velora.db:
    container_name: velora-db
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--oplogSize", "64"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status(); } catch (e) { if (e.code !== 94) throw e; rs.initiate({_id:'rs0',members:[{_id:0,host:'velora-db:27017'}]}); } if (!db.hello().isWritablePrimary) quit(1);"]
      interval: 3s
      timeout: 5s
      retries: 30
    ports:
      - "27017:27017"
    volumes:
      - ${WEBAPP_STORAGE_HOME}/site:/data/db
