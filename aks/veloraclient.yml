apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: velora-client-keys
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: veloraclient-deployment
  labels:
    app: veloraclient
spec:
  replicas: 2
  selector:
    matchLabels:
      app: veloraclient
  template:
    metadata:
      labels:
        app: veloraclient
    spec:
      securityContext:
        fsGroup: 1654
      imagePullSecrets: 
        - name: acr-secret
      containers:
        - name: veloraclient
          image: veloradevacr.azurecr.io/veloraclient:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DataProtection__KeysPath
              value: /var/velora/keys
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: CatalogApiUrl
              valueFrom:
                  configMapKeyRef:
                    name: veloraapi-configmap
                    key: veloraapi_url
          volumeMounts:
            - name: account-keys
              mountPath: /var/velora/keys
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
      volumes:
        - name: account-keys
          persistentVolumeClaim:
            claimName: velora-client-keys
---
apiVersion: v1
kind: Service
metadata:
  name: veloraclient-service
spec:
  type: LoadBalancer
  selector:
    app: veloraclient
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
