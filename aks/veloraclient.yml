apiVersion: apps/v1
kind: Deployment
metadata:
  name: veloraclient-deployment
  labels:
    app: veloraclient
spec:
  replicas: 2
  selector:
    matchLabels:
      app: veloraclient
  template:
    metadata:
      labels:
        app: veloraclient
    spec:
      imagePullSecrets: 
        - name: acr-secret
      containers:
        - name: veloraclient
          image: veloradevacr.azurecr.io/veloraclient:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: CatalogApiUrl
              valueFrom:
                  configMapKeyRef:
                    name: veloraapi-configmap
                    key: veloraapi_url
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: veloraclient-service
spec:
  type: LoadBalancer
  selector:
    app: veloraclient
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
