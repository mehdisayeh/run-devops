apiVersion: apps/v1
kind: Deployment
metadata:
  name: veloraclient-deployment
  labels:
    app: veloraclient
spec:
  replicas: 1
  selector:
    matchLabels:
      app: veloraclient
  template:
    metadata:
      labels:
        app: veloraclient
    spec:
      containers:
        - name: veloraclient
          image: mehdisayeh/veloraclient:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: CatalogApiUrl
              valueFrom:
                  configMapKeyRef:
                    name: veloraapi-configmap
                    key: veloraapi_url
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: veloraclient-service
spec:
  type: NodePort
  selector:
    app: veloraclient
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8080
      nodePort: 30000
