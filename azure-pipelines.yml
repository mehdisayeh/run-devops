trigger:
  - main

resources:
  - repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build image
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build Velora API
            inputs:
              command: build
              repository: veloraapi
              Dockerfile: '$(Build.SourcesDirectory)/Velora/Velora.API/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)/Velora'
              tags: |
                $(tag)